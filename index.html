    p { color: #47464B; line-height: 1.5; }
    a {
      display: block;
      margin-top: 0.75rem;
      color: #8B4E37;
      font-weight: 600;
      text-decoration: none;
    }

  <div class="card">
    <h1>Ruvex Legal</h1>
    <p>English Terms of Service and Privacy Policy for the Ruvex iOS app.</p>
